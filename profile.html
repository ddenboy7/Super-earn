<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - SUPER EARN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7fc;
    font-family:Arial, sans-serif;
    margin:0;
    padding:20px;
}
.header{
    background:#07204a;
    color:white;
    text-align:center;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}
.box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>
</head>
<body>

<div class="header">
    <h3>Profile</h3>
</div>

<div class="box">
    <p><strong>Name:</strong> John Doe</p>
    <p><strong>Email:</strong> johndoe@example.com</p>
    <p><strong>Phone:</strong> +256 700 000000</p>
    <button class="btn btn-primary w-100">Edit Profile</button>
</div>

</div>

<div class="referral">
    <h5>Your Referral Link</h5>
    <p>Copy & share this link to invite your friends. Earn bonuses when they invest.</p>
    <p>🔶 Level 1 = 10% &nbsp; 🔷 Level 2 = 5% &nbsp; 🔷 Level 3 = 1%</p>
    <input type="text" id="refLink" value="https://superearn.com/register?reff=YourName" readonly>
    <button class="copy-btn" onclick="copyLink()">Copy Link</button>
</div>

<script>
function copyLink() {
    var copyText = document.getElementById("refLink");
    copyText.select();
    copyText.setSelectionRange(0, 99999); 
    document.execCommand("copy");
    alert("Referral link copied: " + copyText.value);
}
</script>
</body>
</html>
