<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUPER EARN</title>

<!-- Prevent Google from showing site in search -->
<meta name="robots" content="noindex, nofollow">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fc;
}

.hero{
    background:#07204a;
    color:white;
    text-align:center;
    padding:80px 20px;
}

/* Logo container */
.logo-container{
    display: flex;
    flex-direction: column; /* stack logo above title */
    align-items: center;    /* center horizontally */
    text-align: center;
    margin-bottom: 20px;    /* space below logo */
}

.logo-img{
    width: 120px;           /* adjust logo size */
    max-width: 50%;         /* responsive for small screens */
    margin-bottom: 15px;    /* space between logo and title */
}

.hero h1{
    font-size:40px;
    margin-bottom:10px;
}

.btn-main{
    background:#0d6efd;
    border:none;
    padding:12px 25px;
    color:white;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
}

.section{
    padding:40px 20px;
    text-align:center;
}
</style>
</head>

<body>

<div class="hero">
    <!-- Logo + Title -->
    <div class="logo-container">
        <img src="logo.png" alt="Super Earn Logo" class="logo-img">
        <h1>SUPER EARN</h1>
    </div>

    <p>Secure Digital Investment Platform</p>

    <a href="login.html" class="btn-main">
        Get Started
    </a>
</div>

<div class="section">
    <h3>Welcome to Super Earn</h3>
    <p>Earn 10% of your investment everyday for 90 days.</p>
</div>

</body>
</html>
